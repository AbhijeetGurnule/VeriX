# Development version of configuration
server:
  port: 8083

# Database connections
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_app
    username: root
    password: admin

#    hikari:
#      pool-name: HikariCP
#      maximum-pool-size: 5
#      connection-timeout: 10000
#      idle-timeout: 600000
#      max-lifetime: 1800000
#      validation-timeout: 1800000
#      leak-detection-threshold: 0
#      initialization-fail-timeout: -1

# JPA and Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

# Enable debug logs for Spring Security
logging:
  level:
    org.springframework.security: DEBUG

# JWT security configuration
security:
  jwt:
    # Secret key used to sign JWT tokens
    secret: ${JWT_SECRET:ykSehTnIdnomaiDAekiL;hgiHoSdlroWehTevobApU;erAuoYtahWrednoWIwoH;ratSelttiLelkniwTelkniwT}

    # Identifies the application that issues the token
    issuer: ${JWT_ISSUER:api.substring.com}

    # Access token validity: 1 hour
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}

    # Refresh token validity: 24 hours
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}

    # Name of the refresh token cookie
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}

    # Send cookie only over HTTPS
    cookie-secure: ${JWT_COOKIE_SECURE:true}

    # Prevent JavaScript from accessing the cookie
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}

    # Restrict cross-site cookie requests
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}